<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор игры</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            color: white; padding: 20px;
        }
        .container {
            text-align: center; padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px; border: 2px solid rgba(100, 150, 255, 0.3);
            box-shadow: 0 0 40px rgba(100, 150, 255, 0.2);
            max-width: 400px; width: 100%; animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 {
            font-size: 26px; margin-bottom: 20px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        button {
            display: block; width: 100%; padding: 18px; margin-bottom: 15px;
            font-size: 18px; font-weight: bold; border: none; border-radius: 12px;
            cursor: pointer; transition: all 0.3s ease; color: white;
        }
        .btn-number {
            background: linear-gradient(90deg, #00c853, #00e676);
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.5);
        }
        .btn-memory {
            background: linear-gradient(90deg, #7b2ff7, #00d4ff);
            box-shadow: 0 0 20px rgba(123, 47, 247, 0.5);
        }
        .btn-back {
            background: linear-gradient(90deg, #616161, #9e9e9e);
            box-shadow: 0 0 20px rgba(100, 100, 100, 0.4);
            font-size: 16px; padding: 12px;
        }
        button:hover { transform: scale(1.04); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 ВЫБЕРИ ИГРУ</h1>
        <button class="btn-number" onclick="openGame()">🎯 УГАДАЙ ЧИСЛО</button>
        <button class="btn-memory" onclick="openMemory()">🎨 ЦВЕТНАЯ ПАМЯТЬ</button>
        <button class="btn-back" onclick="goBack()">⬅️ НАЗАД</button>
    </div>

    <script>
        function openGame() {
            window.location.href = "game.html";
        }
        function openMemory() {
            window.location.href = "memory.html";
        }
        function goBack() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
