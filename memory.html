<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цветная память</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .container {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 2px solid rgba(100, 150, 255, 0.3);
            box-shadow: 0 0 40px rgba(100, 150, 255, 0.2);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: #a0a0c0;
            margin-bottom: 20px;
        }

        .info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .info span {
            color: #00d4ff;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .color-btn {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 15px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.5;
        }

        .color-btn.active {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 0 25px currentColor;
        }

        .color-btn:active {
            transform: scale(0.95);
        }

        .color-btn:disabled {
            cursor: not-allowed;
        }

        #red { background: #ff5252; color: #ff5252; }
        #blue { background: #448aff; color: #448aff; }
        #green { background: #00e676; color: #00e676; }
        #yellow { background: #ffd740; color: #ffd740; }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            background: linear-gradient(90deg, #00c853, #00e676);
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.5);
            margin-bottom: 10px;
        }

        button:hover {
            transform: scale(1.03);
        }

        .message {
            font-size: 18px;
            min-height: 30px;
            margin-top: 10px;
            font-weight: bold;
        }

        .win { color: #00e676; }
        .lose { color: #ff5252; }
        .hint { color: #ffb74d; }

        .restart-btn {
            background: linear-gradient(90deg, #ff9800, #ffb74d) !important;
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.5) !important;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 ЦВЕТНАЯ ПАМЯТЬ</h1>
        <p class="subtitle">Запомни порядок цветов и повтори!</p>

        <div class="info">
            <div>Уровень: <span id="level">1</span></div>
            <div>Рекорд: <span id="record">0</span></div>
        </div>

        <div class="grid">
            <button class="color-btn" id="red" onclick="handleClick('red')"></button>
            <button class="color-btn" id="blue" onclick="handleClick('blue')"></button>
            <button class="color-btn" id="green" onclick="handleClick('green')"></button>
            <button class="color-btn" id="yellow" onclick="handleClick('yellow')"></button>
        </div>

        <button id="startBtn" onclick="startGame()">▶️ НАЧАТЬ</button>
        <button class="restart-btn" id="restartBtn" onclick="startGame()">🔄 ИГРАТЬ ЗАНОВО</button>

        <div class="message" id="message"></div>
    </div>

    <script>
        const colors = ['red', 'blue', 'green', 'yellow'];
        let sequence = [];
        let playerSequence = [];
        let level = 1;
        let record = 0;
        let isShowing = false;
        let canClick = false;

        function startGame() {
            sequence = [];
            playerSequence = [];
            level = 1;
            document.getElementById('level').textContent = level;
            document.getElementById('message').textContent = "";
            document.getElementById('message').className = "message";
            document.getElementById('restartBtn').style.display = "none";
            document.getElementById('startBtn').style.display = "none";
            document.querySelectorAll('.color-btn').forEach(btn => btn.disabled = false);
            nextLevel();
        }

        function nextLevel() {
            playerSequence = [];
            sequence.push(colors[Math.floor(Math.random() * 4)]);
            showSequence();
        }

        function showSequence() {
            isShowing = true;
            canClick = false;
            let i = 0;

            const interval = setInterval(() => {
                if (i >= sequence.length) {
                    clearInterval(interval);
                    isShowing = false;
                    canClick = true;
                    document.getElementById('message').textContent = "Твой ход!";
                    document.getElementById('message').className = "message hint";
                    return;
                }

                const color = sequence[i];
                const btn = document.getElementById(color);

                btn.classList.add('active');
                setTimeout(() => {
                    btn.classList.remove('active');
                }, 400);

                i++;
            }, 700);
        }

        function handleClick(color) {
            if (!canClick || isShowing) return;

            const btn = document.getElementById(color);
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 200);

            playerSequence.push(color);

            const index = playerSequence.length - 1;
            if (playerSequence[index] !== sequence[index]) {
                document.getElementById('message').textContent = "❌ Ошибка! Игра окончена.";
                document.getElementById('message').className = "message lose";
                canClick = false;
                document.querySelectorAll('.color-btn').forEach(btn => btn.disabled = true);
                document.getElementById('restartBtn').style.display = "block";

                if (level > record) {
                    record = level;
                    document.getElementById('record').textContent = record;
                }
                return;
            }

            if (playerSequence.length === sequence.length) {
                canClick = false;
                document.getElementById('message').textContent = "✅ Молодец! Следующий уровень...";
                document.getElementById('message').className = "message win";
                level++;
                document.getElementById('level').textContent = level;
                setTimeout(() => nextLevel(), 1000);
            }
        }
    </script>
</body>
</html>
