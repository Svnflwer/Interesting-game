<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мозговой Вызов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 2px solid rgba(100, 150, 255, 0.3);
            box-shadow: 0 0 40px rgba(100, 150, 255, 0.2);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 16px;
            color: #a0a0c0;
            margin-bottom: 30px;
        }

        .emoji-row {
            font-size: 40px;
            margin-bottom: 20px;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-play {
            background: linear-gradient(90deg, #00c853, #00e676);
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.5);
        }

        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 200, 83, 0.8);
        }

        .btn-settings {
            background: linear-gradient(90deg, #ff9800, #ffb74d);
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.4);
        }

        .btn-settings:hover {
            transform: scale(1.05);
        }

        .btn-rules {
            background: linear-gradient(90deg, #2196f3, #64b5f6);
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.4);
        }

        .btn-rules:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }

        .footer a {
            color: #00d4ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji-row">🧠🎨</div>
        <h1>МОЗГОВОЙ ВЫЗОВ</h1>
        <p class="subtitle">Угадай число и запомни цвета!</p>

        <button class="btn-play" onclick="startGame()">🎮 ИГРАТЬ</button>
        <button class="btn-settings" onclick="openSettings()">⚙️ НАСТРОЙКИ</button>
        <button class="btn-rules" onclick="openRules()">📖 ПРАВИЛА</button>

        <div class="footer">
            Создано <a href="https://github.com/svnflwer" target="_blank">Svnflwer</a>
        </div>
    </div>

    <script>
        function startGame() {
            // Здесь будет переход на игру
            // Пока просто заглушка
            alert("Игра скоро начнётся! 🎮");
            // Когда будет готова игра — здесь будет:
            // window.location.href = "game.html";
        }

        function openSettings() {
            alert("Настройки скоро появятся! ⚙️");
        }

        function openRules() {
            alert(
                "ПРАВИЛА ИГРЫ:\n\n" +
                "1. Угадай число от 1 до 50\n" +
                "2. У тебя 5 попыток\n" +
                "3. Потом запомни цвета\n" +
                "4. Чем больше — тем больше очков!\n\n" +
                "Удачи! 🧠🎨"
            );
        }
    </script>
</body>
  </html>
